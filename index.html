<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>命题企业技术副总裁王琳评价</title>
<meta name="theme-color" content="#0d1014">
<meta name="description" content="命题企业技术副总裁王琳对参赛项目的评价视频。">
<meta property="og:type" content="video.other">
<meta property="og:title" content="命题企业技术副总裁王琳评价">
<meta property="og:description" content="命题企业技术副总裁王琳对参赛项目的评价视频，时长 12 秒。">
<meta property="og:image" content="poster.jpg">
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body{display:flex; flex-direction:column}

  /* 常驻标题栏：不淡出、不遮挡画面 */
  header{
    flex:0 0 auto;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
    background:#0d1014;
    border-bottom:1px solid rgba(255,255,255,.08);
    text-align:center;
  }
  h1{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:clamp(16px, 4.4vw, 22px);
    line-height:1.35;
    font-weight:600;
    letter-spacing:.02em;
    color:#f2f5f8;
    text-wrap:balance;
  }

  /* 视频区：占满标题栏以下的全部空间 */
  main{flex:1 1 auto; position:relative; min-height:0; background:#000}
  video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; background:#000; outline:none; display:block;
  }

  .play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:84px; height:84px; border-radius:50%; cursor:pointer; padding:0;
    border:1.5px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.42);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .25s ease;
  }
  .play svg{margin-left:5px; opacity:.95}
  .play[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1>命题企业技术副总裁王琳评价</h1>
</header>

<main>
  <video id="player" controls playsinline webkit-playsinline x5-playsinline
         preload="auto" poster="poster.jpg">
    <source src="video.mp4" type="video/mp4">
  </video>
  <button class="play" id="bigplay" type="button" aria-label="播放">
    <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
      <path d="M8 5.14v13.72L19 12 8 5.14z" fill="#fff"/>
    </svg>
  </button>
</main>

<script>
  (function () {
    var v = document.getElementById('player');
    var play = document.getElementById('bigplay');
    if (!v || !play) return;

    play.addEventListener('click', function () {
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    });
    v.addEventListener('play', function () { play.hidden = true; });
    v.addEventListener('pause', function () { if (!v.ended) play.hidden = false; });
    v.addEventListener('ended', function () { play.hidden = false; });
  })();
</script>
</body>
</html>
