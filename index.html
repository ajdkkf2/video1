<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>视频</title>
<meta name="theme-color" content="#000000">
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed; inset:0; background:#000}
  video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; background:#000; outline:none; display:block;
  }
  /* 中间播放按钮：只在未播放时出现 */
  .play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:88px; height:88px; border-radius:50%; cursor:pointer;
    border:1.5px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.42);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:opacity .25s ease, transform .25s ease;
  }
  .play svg{margin-left:5px; opacity:.95}
  .play[hidden]{display:none}
  /* 底部字幕：进入后淡出，不干扰观看 */
  .caption{
    position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom, 0px) + 92px);
    text-align:center; color:rgba(255,255,255,.78); font-size:13px; letter-spacing:.04em;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    pointer-events:none; transition:opacity .6s ease; opacity:1;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }
  .caption.fade{opacity:0}
</style>
</head>
<body>
<div id="stage">
  <video id="player" controls playsinline webkit-playsinline x5-playsinline
         preload="auto" poster="poster.jpg">
    <source src="video.mp4" type="video/mp4">
  </video>
  <button class="play" id="bigplay" type="button" aria-label="播放">
    <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
      <path d="M8 5.14v13.72L19 12 8 5.14z" fill="#fff"/>
    </svg>
  </button>
  <div class="caption" id="caption">命题企业技术副总裁王琳评价</div>
</div>

<script>
  (function () {
    var v = document.getElementById('player');
    var play = document.getElementById('bigplay');
    var cap = document.getElementById('caption');
    if (!v) return;

    function hideCaption() { if (cap) cap.classList.add('fade'); }

    if (play) {
      play.addEventListener('click', function () {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      });
    }
    v.addEventListener('play', function () {
      if (play) play.hidden = true;
      hideCaption();
    });
    v.addEventListener('pause', function () {
      if (play && !v.ended) play.hidden = false;
    });
    v.addEventListener('ended', function () {
      if (play) play.hidden = false;
    });
    // 3 秒后自动淡出字幕，避免挡住画面
    setTimeout(hideCaption, 3000);
  })();
</script>
</body>
</html>
